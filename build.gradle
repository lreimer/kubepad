plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'groovy'
    id 'com.github.hierynomus.license' version '0.16.1'
}

ext {
    slf4jVersion = '1.7.20'
}

repositories {
    flatDir {
        dirs 'lib'
    }
    mavenCentral()
}

license {
    skipExistingHeaders = true
    header rootProject.file('LICENSE')
    includes(["**/*.java", "**/*.kt", "**/*.groovy"])
    mapping {
        java = 'SLASHSTAR_STYLE'
        kt = 'SLASHSTAR_STYLE'
        groovy = 'SLASHSTAR_STYLE'
    }
}

group = 'de.qaware.cloud.nativ.kpad'
version = '1.3.1'

application {
    mainClass = 'de.qaware.cloud.nativ.kpad.KubepadApplication'
    applicationDefaultJvmArgs = ['-Djava.library.path=../lib']
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    implementation 'io.fabric8:kubernetes-api:3.0.12'
    implementation 'io.fabric8:kubernetes-model:4.6.1'
    implementation 'io.fabric8:kubernetes-client:4.6.1'
    implementation 'io.fabric8:openshift-client:4.6.1'

    implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'

    implementation 'com.moandjiezana.toml:toml4j:0.7.1'

    implementation ':LeapJava:2.3.1'

    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "org.slf4j:jul-to-slf4j:$slf4jVersion"
    implementation 'org.apache.deltaspike.cdictrl:deltaspike-cdictrl-api:1.5.4'
    implementation 'org.apache.deltaspike.core:deltaspike-core-api:1.5.4'
    implementation 'javax.enterprise:cdi-api:2.0.SP1'

    runtimeOnly "org.slf4j:jcl-over-slf4j:$slf4jVersion"
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.25.3'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.25.3'
    runtimeOnly 'org.apache.deltaspike.cdictrl:deltaspike-cdictrl-weld:1.5.4'
    runtimeOnly 'org.apache.deltaspike.core:deltaspike-core-impl:1.5.4'
    runtimeOnly 'org.jboss.weld.se:weld-se-core:3.1.9.Final'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.github.tomakehurst:wiremock:2.1.9"
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

test {
    useJUnitPlatform()
    // exclude the technology integration tests
    exclude '**/*IT.class'

    jvmArgs '-Djava.library.path=./lib'

    reports {
        junitXml.required = true
        html.required = true
    }
}

distributions {
    main {
        contents {
            from("lib") {
                into "lib"
            }
        }
    }
}

task createDcosPadStartScripts(type: CreateStartScripts) {
    outputDir = file('build/scripts')
    mainClass = application.mainClass
    applicationName = 'dcospad'
    defaultJvmOpts = ['-Djava.library.path=../lib', '-Dcluster.service=marathon']
    classpath = startScripts.classpath
}

startScripts.dependsOn createDcosPadStartScripts

task createOcPadStartScripts(type: CreateStartScripts) {
    outputDir = file('build/scripts')
    mainClass = application.mainClass
    applicationName = 'ocpad'
    defaultJvmOpts = ['-Djava.library.path=../lib', '-Dcluster.service=openshift']
    classpath = startScripts.classpath
}

startScripts.dependsOn createOcPadStartScripts
